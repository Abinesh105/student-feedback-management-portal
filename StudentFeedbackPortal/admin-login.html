<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Student Feedback Portal</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page admin-bg">
    <div class="auth-shell">
      <div class="auth-card admin-card">
        <div class="auth-brand">Student Feedback</div>
        <h2>Admin Login</h2>
        <p>Manage faculty reviews, reports, and feedback insights.</p>

        <form class="auth-form" id="adminLoginForm">
          <label>
            Username
            <input id="adminUser" type="text" placeholder="Enter admin username" required />
          </label>
          <label>
            Password
            <input id="adminPassword" type="password" placeholder="Enter password" required />
          </label>
          <button type="submit" class="btn btn-primary full-width">Login</button>
        </form>

        <div class="auth-links">
          <a href="index.html">Back to home</a>
          <a href="login.html">Student login</a>
        </div>
      </div>
    </div>

    <script>
      document.getElementById('adminLoginForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const username = document.getElementById('adminUser').value.trim();
        const password = document.getElementById('adminPassword').value.trim();

        if (!username || !password) {
          alert('Please enter both username and password.');
          return;
        }

        if (username === 'admin' && password === 'admin123') {
          window.location.href = 'dashboard.html';
        } else {
          alert('Invalid admin credentials. Try Username: admin and Password: admin123');
        }
      });
    </script>
  </body>
</html>
